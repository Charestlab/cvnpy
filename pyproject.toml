[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvnpy"
version = "0.1.6"
description = "Python tools for CVN-style cortical flatmap and inflated-surface visualizations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  { name = "cvnpy contributors" }
]
keywords = [
  "cortex",
  "flatmap",
  "freesurfer",
  "neuroimaging",
  "visualization"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Visualization"
]
dependencies = [
  "numpy>=1.25",
  "scipy>=1.11",
  "nibabel>=5.1",
  "matplotlib>=3.8",
  "Pillow>=10.0",
  "scikit-image>=0.22"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff==0.17.0",
  "twine>=5.0"
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25"
]

[project.urls]
Homepage = "https://github.com/Charestlab/cvnpy"
Documentation = "https://cvnpy.readthedocs.io/"
Repository = "https://github.com/Charestlab/cvnpy"
Issues = "https://github.com/Charestlab/cvnpy/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
